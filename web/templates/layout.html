{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{template "title" .}}</title>
<meta name="description" content="{{template "desc" .}}">
<link rel="alternate" type="application/rss+xml" title="RSS" href="/rss">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🐼</text></svg>">
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#42b883'}}}}</script>
<style>
.nav-link{color:#6b7280;font-size:14px;transition:color .2s;text-decoration:none}
.nav-link:hover{color:#42b883;text-decoration:none}
pre{background:#272822!important;border-radius:8px;padding:16px;overflow-x:auto;margin:16px 0}
pre code{background:none!important;color:#f8f8f2!important;padding:0!important;font-size:14px;line-height:1.6}
code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:.9em;font-family:Menlo,Monaco,monospace}
pre code span{background:none!important}
</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
<header class="border-b border-gray-200 bg-white sticky top-0 z-10">
  <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
    <a href="/" class="text-lg font-bold text-gray-800 hover:text-primary transition-colors no-underline">🐼 {{index .Config "title"}}</a>
    <nav class="flex gap-5">
      <a href="/" class="nav-link">首页</a>
      <a href="/projects" class="nav-link">项目</a>
      <a href="/blog" class="nav-link">博客</a>
      <a href="/about" class="nav-link">关于</a>
    </nav>
  </div>
</header>
<main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full">{{template "content" .}}</main>
<footer class="border-t border-gray-200 text-center py-6 text-xs text-gray-400">
  Powered by <a href="https://github.com/zhangpanda/panda-site" class="text-primary hover:underline">熊猫小站</a>
  <span class="mx-1">|</span>
  <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" class="hover:underline">京ICP备2026019723号-2</a>
</footer>
</body>
</html>{{end}}

{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{template "title" .}}</title>
<meta name="description" content="{{template "desc" .}}">
<link rel="alternate" type="application/rss+xml" title="RSS" href="/rss">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🐼</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#a78bfa',gold:'#d4a853',dark:'#0a0e1a',card:'rgba(19,24,41,0.8)',border:'#1e2942'},fontFamily:{kai:['"LXGW WenKai"','"PingFang SC"','"Microsoft YaHei"','serif']}}}}</script>
<style>
body{background:#0a0e1a;color:#e2e8f0;overflow-x:hidden}
.scrollbar-hidden{scrollbar-width:none;-ms-overflow-style:none}
.scrollbar-hidden::-webkit-scrollbar{display:none}
/* 全局灵气背景 */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(167,139,250,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(212,168,83,0.05) 0%,transparent 40%);pointer-events:none;z-index:0}
.nav-link{color:#94a3b8;font-size:14px;transition:all .3s;text-decoration:none;font-family:'LXGW WenKai','PingFang SC','Microsoft YaHei',serif;position:relative}
.nav-link:hover{color:#a78bfa;text-shadow:0 0 8px rgba(167,139,250,0.5)}
.nav-link::after{content:'';position:absolute;bottom:-2px;left:50%;width:0;height:1px;background:#a78bfa;transition:all .3s;transform:translateX(-50%)}
.nav-link:hover::after{width:100%}
.nav-active{color:#a78bfa!important;text-shadow:0 0 8px rgba(167,139,250,0.5)}
.nav-active::after{width:100%!important}
header{background:rgba(10,14,26,0.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(167,139,250,0.1)}
header::after{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,#a78bfa44,#d4a85366,#a78bfa44,transparent)}
/* 卡片 - 符文边框 */
.card{background:rgba(19,24,41,0.8);border:1px solid #1e2942;border-radius:12px;transition:all .4s;position:relative;backdrop-filter:blur(4px)}
.card::before{content:'';position:absolute;inset:-1px;border-radius:12px;background:linear-gradient(135deg,rgba(167,139,250,0) 0%,rgba(167,139,250,0.1) 50%,rgba(212,168,83,0) 100%);opacity:0;transition:opacity .4s;pointer-events:none}
.card:hover{border-color:rgba(167,139,250,0.3);box-shadow:0 0 30px rgba(167,139,250,0.1),inset 0 0 20px rgba(167,139,250,0.03);transform:translateY(-2px)}
.card:hover::before{opacity:1}
.tag{background:rgba(167,139,250,0.1);color:#a78bfa;padding:2px 8px;border-radius:9999px;font-size:12px;border:1px solid rgba(167,139,250,0.2)}
a{color:#a78bfa;text-decoration:none;transition:color .2s}
a:hover{color:#d4a853}
pre{background:#0d1117!important;border:1px solid #1e2942;border-radius:8px;padding:16px;overflow-x:auto;margin:16px 0}
pre code{background:none!important;color:#e2e8f0!important;padding:0!important;font-size:14px;line-height:1.6}
code{background:rgba(167,139,250,0.1);padding:2px 6px;border-radius:4px;font-size:.9em;font-family:Menlo,Monaco,monospace;color:#a78bfa}
pre code span{background:none!important}
.prose{color:#cbd5e1}
.prose h1,.prose h2,.prose h3{color:#e2e8f0;font-family:'LXGW WenKai','PingFang SC','Microsoft YaHei',serif}
.prose a{color:#a78bfa}
.prose strong{color:#e2e8f0}
.prose code{background:rgba(167,139,250,0.1);color:#a78bfa}
.prose blockquote{border-left-color:rgba(167,139,250,0.3);color:#94a3b8}
.prose table th{color:#e2e8f0;border-color:#1e2942}
.prose table td{color:#cbd5e1;border-color:#1e2942}
.prose table tr{border-color:#1e2942}
.prose hr{border-color:#1e2942}
/* 发光文字 */
.glow-text{text-shadow:0 0 10px rgba(167,139,250,0.4),0 0 40px rgba(167,139,250,0.1)}
.glow-gold{text-shadow:0 0 10px rgba(212,168,83,0.4),0 0 40px rgba(212,168,83,0.1)}
/* 道纹分隔 */
.dao-divider{height:1px;background:linear-gradient(90deg,transparent,#a78bfa22,#d4a85344,#a78bfa22,transparent);margin:2rem 0;position:relative}
.dao-divider::after{content:'☯';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0a0e1a;padding:0 12px;color:rgba(167,139,250,0.4);font-size:12px}
/* 呼吸光效 */
@keyframes breathe{0%,100%{opacity:0.4}50%{opacity:0.8}}
.breathe{animation:breathe 4s ease-in-out infinite}
/* 旋转八卦 */
@keyframes spin-slow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spin-slow{animation:spin-slow 30s linear infinite}
</style>
</head>
<body class="min-h-screen flex flex-col font-kai">
<!-- 全站灵气粒子背景 -->
<canvas id="spirit-bg" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>
<header class="sticky top-0 z-10">
  <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
    <a href="/" class="text-lg font-bold text-white hover:text-primary transition-colors no-underline glow-text flex items-center gap-2 shrink-0">
      <span class="spin-slow inline-block" style="font-size:20px">☯</span>
      {{index .Config "title"}}
    </a>
    <nav class="flex gap-3 sm:gap-5 overflow-x-auto scrollbar-hidden whitespace-nowrap ml-4 min-w-0" id="main-nav">
      <a href="/" class="nav-link">山门</a>
      <a href="/projects" class="nav-link">法宝阁</a>
      <a href="/blog" class="nav-link">洞府札记</a>
      <a href="/links" class="nav-link">仙友录</a>
      <a href="/sponsor" class="nav-link">添香</a>
      <a href="/about" class="nav-link">道友信息</a>
    </nav>
  </div>
</header>
<script>
(function(){
  const path = location.pathname;
  document.querySelectorAll('#main-nav .nav-link').forEach(a=>{
    const href = a.getAttribute('href');
    if(href==='/' ? path==='/' : path.startsWith(href)){
      a.classList.add('nav-active');
    }
  });
})();
</script>
<main class="flex-1 max-w-4xl mx-auto px-4 py-8 w-full relative z-[1]">{{template "content" .}}</main>
<footer class="border-t border-border/50 text-center py-8 text-xs text-gray-500 relative z-[1]">
  <p class="mb-2 text-gold/60 tracking-wider font-kai glow-gold">以算力为灵气，以数据为丹砂；以模型悟大道，以智能证长生。</p>
  <p class="mb-2">AI修道院出品 · Powered by <a href="https://github.com/zhangpanda/panda-site" class="hover:underline">熊猫小站</a></p>
  <p>
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" class="text-gray-500 hover:text-primary hover:underline">京ICP备2026019723号-2</a>
    <span class="mx-1 text-gray-600">|</span>
    <a href="https://beian.mps.gov.cn/#/query/webSearch?code=11011302007936" target="_blank" rel="noopener" class="text-gray-500 hover:text-primary hover:underline">京公网安备11011302007936号</a>
  </p>
</footer>
<script>
// 全站灵气背景粒子
(function(){
  const canvas = document.getElementById('spirit-bg');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h, particles = [], mouseX = -1000, mouseY = -1000;
  const COUNT = 150;
  const CONNECT = 130;

  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }

  function init(){
    resize();
    particles = [];
    for(let i=0;i<COUNT;i++){
      particles.push({
        x: Math.random()*w, y: Math.random()*h,
        r: Math.random()*2+0.5,
        dx: (Math.random()-0.5)*0.35,
        dy: (Math.random()-0.5)*0.25,
        alpha: Math.random()*0.6+0.2,
        pulse: Math.random()*Math.PI*2,
        color: Math.random()>0.75 ? [212,168,83] : [167,139,250]
      });
    }
  }

  document.addEventListener('mousemove', e=>{ mouseX=e.clientX; mouseY=e.clientY; });

  function draw(){
    ctx.clearRect(0,0,w,h);

    // 云雾层
    const grd = ctx.createRadialGradient(w/2, h*0.3, 0, w/2, h*0.3, w*0.6);
    grd.addColorStop(0, 'rgba(167,139,250,0.03)');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,w,h);

    // 灵脉连线
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < CONNECT){
          const a = (1 - dist/CONNECT) * 0.12;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(167,139,250,${a})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
      // 鼠标灵力感应
      const mdx = particles[i].x - mouseX;
      const mdy = particles[i].y - mouseY;
      const mdist = Math.sqrt(mdx*mdx+mdy*mdy);
      if(mdist < 180){
        const a = (1 - mdist/180) * 0.25;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(mouseX, mouseY);
        ctx.strokeStyle = `rgba(212,168,83,${a})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }

    // 粒子绘制
    particles.forEach(p=>{
      p.x += p.dx; p.y += p.dy;
      p.pulse += 0.012;
      if(p.x<0) p.x=w; if(p.x>w) p.x=0;
      if(p.y<0) p.y=h; if(p.y>h) p.y=0;

      // 鼠标排斥
      const mdx2 = p.x - mouseX;
      const mdy2 = p.y - mouseY;
      const md2 = Math.sqrt(mdx2*mdx2+mdy2*mdy2);
      if(md2 < 100){
        p.x += mdx2*0.01;
        p.y += mdy2*0.01;
      }

      const a = p.alpha * (0.5 + 0.5*Math.sin(p.pulse));
      // 外圈光晕
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r*4, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a*0.06})`;
      ctx.fill();
      // 内核
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  init(); draw();
  window.addEventListener('resize', ()=>{ resize(); init(); });
})();
</script>
</body>
</html>{{end}}

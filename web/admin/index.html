<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI修道院 · 管理后台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🐼</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#a78bfa',gold:'#d4a853',dark:'#0a0e1a',card:'#131829',border:'#1e2942'}}}}</script>
<style>
body{background:#0a0e1a;font-family:'LXGW WenKai',serif}
.tab{padding:0 16px;font-size:14px;cursor:pointer;color:#94a3b8;border-bottom:2px solid transparent;line-height:48px;transition:color .2s}
.tab:hover{color:#a78bfa}
.tab.active{color:#a78bfa;border-bottom-color:#a78bfa;font-weight:500}
</style>
</head>
<body class="text-gray-200">
<div id="loginPage" class="max-w-sm mx-auto mt-32 bg-card rounded-xl border border-border shadow-2xl p-8">
  <h2 class="text-xl font-bold text-center mb-2 text-white">🧿 AI修道院</h2>
  <p class="text-center text-xs text-gray-500 mb-6">道友请留步，验明身份方可入内</p>
  <input id="loginUser" class="w-full bg-dark border border-border rounded-lg px-3 py-2 mb-3 text-sm text-gray-200 placeholder-gray-500 focus:border-primary focus:outline-none" placeholder="道号">
  <input id="loginPwd" type="password" class="w-full bg-dark border border-border rounded-lg px-3 py-2 mb-3 text-sm text-gray-200 placeholder-gray-500 focus:border-primary focus:outline-none" placeholder="口令">
  <p id="loginErr" class="text-red-400 text-xs mb-2"></p>
  <button onclick="doLogin()" class="w-full bg-primary/20 text-primary border border-primary/30 rounded-lg py-2 text-sm hover:bg-primary/30 transition-colors">入阵</button>
</div>
<div id="app" style="display:none">
  <div class="bg-card border-b border-border"><div class="max-w-5xl mx-auto px-4 flex items-center justify-between h-12 gap-4">
    <span class="font-bold text-sm text-white shrink-0">🧿 AI修道院</span>
    <div class="flex overflow-x-auto whitespace-nowrap">
      <div class="tab active" data-sec="articles" onclick="showSec('articles')">文章</div>
      <div class="tab" data-sec="projects" onclick="showSec('projects')">项目</div>
      <div class="tab" data-sec="links" onclick="showSec('links')">友链</div>
      <div class="tab" data-sec="sponsors" onclick="showSec('sponsors')">赞助</div>
      <div class="tab" data-sec="categories" onclick="showSec('categories')">分类</div>
      <div class="tab" data-sec="config" onclick="showSec('config')">设置</div>
      <a href="/" target="_blank" class="tab">查看站点</a>
      <div class="tab" onclick="logout()">退出</div>
    </div>
  </div></div>
  <div class="max-w-4xl mx-auto px-4 py-6" id="content"></div>
</div>
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-2 rounded-lg text-sm hidden z-50"></div>
<script src="admin.js"></script>
</body>
</html>

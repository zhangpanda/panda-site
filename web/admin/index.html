<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>熊猫小站 管理后台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#42b883'}}}}</script>
<style>
.tab{padding:0 16px;font-size:14px;cursor:pointer;color:#6b7280;border-bottom:2px solid transparent;line-height:48px;transition:color .2s}
.tab:hover{color:#42b883}
.tab.active{color:#42b883;border-bottom-color:#42b883;font-weight:500}
</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="loginPage" class="max-w-sm mx-auto mt-32 bg-white rounded-xl shadow p-8">
  <h2 class="text-xl font-bold text-center mb-6">🐼 熊猫小站</h2>
  <input id="loginUser" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm" placeholder="用户名">
  <input id="loginPwd" type="password" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm" placeholder="密码">
  <p id="loginErr" class="text-red-500 text-xs mb-2"></p>
  <button onclick="doLogin()" class="w-full bg-primary text-white rounded-lg py-2 text-sm hover:opacity-90">登录</button>
</div>
<div id="app" style="display:none">
  <div class="bg-white border-b"><div class="max-w-4xl mx-auto px-4 flex items-center justify-between h-12">
    <span class="font-bold text-sm">🐼 熊猫小站</span>
    <div class="flex">
      <div class="tab active" data-sec="articles" onclick="showSec('articles')">文章</div>
      <div class="tab" data-sec="projects" onclick="showSec('projects')">项目</div>
      <div class="tab" data-sec="categories" onclick="showSec('categories')">分类</div>
      <div class="tab" data-sec="config" onclick="showSec('config')">设置</div>
      <a href="/" target="_blank" class="tab">查看站点</a>
      <div class="tab" onclick="logout()">退出</div>
    </div>
  </div></div>
  <div class="max-w-4xl mx-auto px-4 py-6" id="content"></div>
</div>
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-2 rounded-lg text-sm hidden z-50"></div>
<script src="admin.js"></script>
</body>
</html>

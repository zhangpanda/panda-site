name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: golang:1.25-alpine
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          apk add --no-cache gcc musl-dev
          CGO_ENABLED=1 go build -ldflags '-linkmode external -extldflags -static' -o panda-site ./cmd/server

      - name: Stop service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: systemctl stop panda-site

      - name: Deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "panda-site,web/"
          target: /opt/zhangpanda.com
          overwrite: true

      - name: Start service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: chmod +x /opt/zhangpanda.com/panda-site && systemctl start panda-site
